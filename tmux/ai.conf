# AI チャット専用の tmux サーバー (tmux -L ai) 向けの設定
# 共通設定を読み込んだうえで、通常サーバーと見分けられるようにアクセント色だけを差し替える

source-file $XDG_CONFIG_HOME/tmux/tmux.conf

# ステータスバーとアクティブペイン枠は @normal_border_color を参照しているので、これを薄ピンクにする
set-option -g @normal_border_color "#f7a8c8"

# tmux.conf の C-r は tmux.conf だけを読み直すため、ai.conf を読み直すように上書きする
bind C-r source-file $XDG_CONFIG_HOME/tmux/ai.conf \; display "Reloaded! (ai)"
